plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cachymusic.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.cachymusic.app"
        minSdk 24
        targetSdk 34
        versionCode 101
        versionName "3.0.0-dev.7.1"
    }
    buildTypes {
        release {
            minifyEnabled false
            // Release APK is unsigned unless explicitly signed by the maintainer.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

tasks.register('syncWorkstationAssets', Sync) {
    from("${project.rootDir}/../../..") {
        include 'index.html', 'manifest.json', 'sw.js', 'LICENSE', 'THIRD-PARTY-NOTICES.md'
        include 'stylesheets/**'
        include 'scripts/**'
        include 'resources/**'
        exclude 'resources/audio/**'
    }
    into "${projectDir}/src/main/assets"
}

preBuild.dependsOn syncWorkstationAssets

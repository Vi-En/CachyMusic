plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cachymusic.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.cachymusic.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0-beta"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}

tasks.register('syncWorkstationAssets', Sync) {
    from("${project.rootDir}/../../..") {
        include 'index.html', 'manifest.json'
        include 'stylesheets/**'
        include 'scripts/**'
        include 'resources/**'
    }
    into "${projectDir}/src/main/assets"
}

preBuild.dependsOn syncWorkstationAssets

plugins {
    id 'com.android.application'
}
android {
    namespace 'org.cachymusic.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.cachymusic.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0-beta"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

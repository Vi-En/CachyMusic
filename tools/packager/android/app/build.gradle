plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cachymusic.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.cachymusic.app"
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName "2.0.1"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

tasks.register('syncWorkstationAssets', Sync) {
    from("${project.rootDir}/../../..") {
        include 'index.html', 'manifest.json'
        include 'stylesheets/**'
        include 'scripts/**'
        include 'resources/**'
        exclude 'resources/audio/**'
    }
    into "${projectDir}/src/main/assets"
}

preBuild.dependsOn syncWorkstationAssets

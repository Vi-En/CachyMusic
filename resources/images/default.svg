<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="24" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Vinyl Groove Aesthetics -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#ringGrad)" stroke-width="2"/>

  <!-- Center Vinyl Label Disc -->
  <circle cx="256" cy="256" r="88" fill="#111827" stroke="rgba(0,229,255,0.3)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="28" fill="#070a0e" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="10" fill="#00e5ff" opacity="0.8"/>

  <!-- Musical Note Icon (Centered, Elegant Vector) -->
  <g filter="url(#glow)">
    <path fill="url(#noteGrad)" d="M332 144c5.3 4.3 8 10.7 8 17.5v150.5c0 31-25.2 56-56.3 56-31 0-56.2-25-56.2-56s25.2-56 56.2-56c7.8 0 15.4 1.6 22.3 4.6V187.3l-112 24.9v145.8c0 31-25.2 56-56.2 56-31 0-56.3-25-56.3-56s25.3-56 56.3-56c7.8 0 15.4 1.6 22.2 4.6V152.7c0-10.5 7.3-19.6 17.6-21.8l136-30.2c6.7-1.5 13.6.1 19.4 4.3z"/>
  </g>
</svg>

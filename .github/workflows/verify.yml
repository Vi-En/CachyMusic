name: Source and Android verification
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test-only system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-curl php-mbstring ffmpeg flac
      - name: Run regression suite
        run: bash tests/run-all.sh
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true
      - name: Prepare Android build SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compile and lint Android
        working-directory: tools/packager/android
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CachyMusic-verified-debug-apk-${{ github.sha }}
          path: tools/packager/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

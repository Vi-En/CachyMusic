name: Build installable Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Lint, test and build latest Android frontend
        working-directory: tools/packager/android
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Check output APK and bundled Soulseek UI
        run: |
          set -euo pipefail
          APK='tools/packager/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          manifest=$(mktemp); trap 'rm -f "$manifest"' EXIT
          unzip -Z1 "$APK" > "$manifest"
          grep -qx 'assets/index.html' "$manifest"
          grep -q '^assets/scripts/modules/' "$manifest"
          grep -q '^assets/stylesheets/' "$manifest"
          sha256sum "$APK" | tee android-apk-sha256.txt
      - name: Publish debug APK for download
        uses: actions/upload-artifact@v4
        with:
          name: CachyMusic-debug-apk-${{ github.sha }}
          path: |
            tools/packager/android/app/build/outputs/apk/debug/app-debug.apk
            android-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
